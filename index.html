<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>كنوز اليوم والليلة</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B1D3A" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#FDFBF7" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="كنوز اليوم">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- خطوط Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Scheherazade+New:wght@400;600;700&family=Noto+Naskh+Arabic+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- مكتبة html-to-image -->
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
    
    <style>
        /* ========== جميع الأنماط كما في الإصدار السابق (مضغوطة هنا) ========== */
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Scheherazade New',serif;
            min-height:100vh;padding:16px;
            transition:background .8s ease;
            background:radial-gradient(ellipse at center,#0a1a30 0%,#030b17 100%);
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            overflow-x:hidden;
        }
        body.morning{background:radial-gradient(ellipse at center,#fff8ec 0%,#fef5e4 100%)}
        .particles-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
        .particle{position:absolute;background:radial-gradient(circle,#C4A35A 0%,transparent 70%);border-radius:50%;filter:blur(0.5px);opacity:0;animation:floatUp linear infinite}
        @keyframes floatUp{0%{transform:translateY(100vh) scale(.5);opacity:0}10%{opacity:.9}90%{opacity:.3}100%{transform:translateY(-10vh) scale(1.4);opacity:0}}
        .particle::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:inherit;border-radius:inherit;animation:twinkle 3s ease-in-out infinite}
        @keyframes twinkle{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.8)}}
        .book-container{
            width:100%;max-width:520px;
            background:rgba(12,20,35,.7);backdrop-filter:blur(20px);
            border-radius:42px;padding:36px 22px 28px;
            box-shadow:0 40px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);
            border:2px solid;
            border-image:linear-gradient(135deg,#C4A35A,#f0d78c,#C4A35A) 1;
            animation:borderShimmer 8s ease-in-out infinite;
            position:relative;z-index:2;transition:.6s;
        }
        @keyframes borderShimmer{0%,100%{border-image:linear-gradient(135deg,#C4A35A,#f0d78c,#C4A35A) 1}50%{border-image:linear-gradient(135deg,#f0d78c,#C4A35A,#f0d78c) 1}}
        body.morning .book-container{
            background:rgba(255,252,246,.8);backdrop-filter:blur(16px);
            box-shadow:0 30px 50px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.6);
            border-image:linear-gradient(135deg,#1D7A6E,#5cb8a5,#1D7A6E) 1;
        }
        .book-container::before,.book-container::after{content:"❉";position:absolute;font-size:2rem;color:#C4A35A;opacity:.5;text-shadow:0 0 12px #C4A35A;z-index:-1;animation:cornerGlow 4s ease-in-out infinite alternate}
        .book-container::before{top:-15px;right:-15px}
        .book-container::after{bottom:-15px;left:-15px}
        @keyframes cornerGlow{from{text-shadow:0 0 8px #C4A35A}to{text-shadow:0 0 22px #f0d78c}}
        .icon-morning,.icon-evening{position:absolute;top:15px;font-size:1.8rem;opacity:.8;z-index:3}
        .icon-morning{right:20px;animation:sunPulse 4s infinite alternate}
        .icon-evening{left:20px;animation:moonRotate 12s linear infinite;opacity:0}
        @keyframes sunPulse{from{transform:scale(1);opacity:.6}to{transform:scale(1.2);opacity:1;filter:drop-shadow(0 0 10px gold)}}
        @keyframes moonRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        .header{text-align:center;margin-bottom:20px}
        .title-main{font-family:'Cairo',sans-serif;font-size:2.2rem;font-weight:800;color:#e6c468;text-shadow:0 4px 14px rgba(196,163,90,.5);line-height:1.4}
        body.morning .title-main{color:#1D7A6E;text-shadow:0 2px 8px rgba(29,122,110,.3)}
        .subtitle{font-family:'Noto Naskh Arabic UI',serif;font-size:1rem;color:#ccbc9c;margin-top:6px}
        body.morning .subtitle{color:#3a5a50}
        .time-selector{display:flex;justify-content:center;gap:10px;margin:20px 0 28px;z-index:3}
        .time-btn{font-family:'Cairo',sans-serif;background:rgba(255,255,255,.06);border:1px solid #C4A35A;color:#C4A35A;padding:10px 24px;border-radius:30px;font-size:1rem;font-weight:700;cursor:pointer;transition:.3s;backdrop-filter:blur(8px)}
        body.morning .time-btn{border-color:#1D7A6E;color:#1D7A6E}
        .time-btn.active{background:#C4A35A;color:#0B1D3A;box-shadow:0 8px 20px rgba(196,163,90,.45);border-color:transparent}
        body.morning .time-btn.active{background:#1D7A6E;color:#fff}
        .dhikr-card{background:rgba(20,30,48,.45);backdrop-filter:blur(14px);border-radius:24px;padding:20px 18px;margin-bottom:24px;border:1px solid rgba(196,163,90,.35);box-shadow:0 12px 28px rgba(0,0,0,.4);position:relative;z-index:2;animation:fadeUp .55s ease both}
        body.morning .dhikr-card{background:rgba(255,250,245,.8);border-color:rgba(29,122,110,.4);box-shadow:0 8px 20px rgba(0,0,0,.06)}
        .misbaha-line{display:flex;gap:6px;margin-bottom:12px;overflow:hidden;height:10px}
        .bead{width:6px;height:6px;background:radial-gradient(circle,#C4A35A,#8b6d32);border-radius:50%;box-shadow:0 0 10px #C4A35A;animation:beadMove 4s linear infinite;flex-shrink:0}
        @keyframes beadMove{0%{transform:translateX(-20px);opacity:.5}50%{opacity:1}100%{transform:translateX(100px);opacity:.3}}
        .dhikr-number{font-family:'Noto Naskh Arabic UI',serif;font-size:.85rem;font-weight:600;color:#C4A35A;background:rgba(196,163,90,.12);padding:5px 14px;border-radius:20px;display:inline-block;margin-bottom:8px}
        body.morning .dhikr-number{color:#1D7A6E;background:rgba(29,122,110,.1)}
        .dhikr-text{font-family:'Scheherazade New',serif;font-size:1.5rem;font-weight:500;line-height:2.2;color:#f5efdf;margin:14px 0 8px;background:linear-gradient(90deg,transparent 0%,rgba(255,215,120,.25) 50%,transparent 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:#f5efdf;animation:textSweep 6s ease-in-out infinite}
        body.morning .dhikr-text{color:#1f2e3c;background:linear-gradient(90deg,transparent 0%,rgba(29,122,110,.2) 50%,transparent 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:#1f2e3c}
        @keyframes textSweep{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
        .source-box{font-family:'Noto Naskh Arabic UI',serif;font-size:.7rem;color:#bbaa88;border-top:1px dashed rgba(196,163,90,.3);padding-top:10px;margin-top:12px;line-height:1.7}
        body.morning .source-box{color:#4f6a5e}
        .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;z-index:3}
        .action-btn{font-family:'Cairo',sans-serif;background:rgba(196,163,90,.08);border:1px solid rgba(196,163,90,.55);color:#e6c468;border-radius:14px;padding:11px 0;flex:1 1 0;text-align:center;font-weight:700;cursor:pointer;transition:.3s;backdrop-filter:blur(6px);font-size:.9rem;min-width:70px}
        body.morning .action-btn{border-color:rgba(29,122,110,.6);color:#1D7A6E;background:rgba(29,122,110,.05)}
        .action-btn:hover{background:rgba(196,163,90,.2)}
        .footer-note{text-align:center;color:#C4A35A;opacity:.75;margin-top:16px;font-family:'Cairo',sans-serif;font-size:.8rem}
        @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
        .scroll-top{position:fixed;bottom:20px;right:20px;background:#C4A35A;color:#0B1D3A;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer;z-index:99}
        body.morning .scroll-top{background:#1D7A6E;color:#fff}
        @media screen and (max-width:480px){
            .book-container{padding:28px 16px 20px;border-radius:32px}
            .title-main{font-size:1.8rem}
            .dhikr-text{font-size:1.3rem}
            .time-btn{padding:8px 18px;font-size:.9rem}
            .action-btn{font-size:.8rem;padding:10px 0}
        }
        @media screen and (max-width:360px){
            .title-main{font-size:1.6rem}
            .dhikr-text{font-size:1.2rem}
        }
    </style>
</head>
<body class="morning">
    <div class="particles-container" id="particlesContainer"></div>

    <div class="book-container" id="mainBook">
        <div class="icon-morning" id="iconMorning">☀️</div>
        <div class="icon-evening" id="iconEvening">🌙</div>
        <div class="header">
            <div class="title-main">كُنُوزُ الْيَوْمِ وَاللَّيْلَةِ</div>
            <div class="subtitle">أذكار الصباح والمساء من القرآن والسنة</div>
        </div>
        <div class="time-selector">
            <button class="time-btn active" id="morningBtn" onclick="switchTime('morning')">☀️ أذكار الصباح</button>
            <button class="time-btn" id="eveningBtn" onclick="switchTime('evening')">🌙 أذكار المساء</button>
        </div>
        <div id="dhikrList"></div>
        <div class="actions">
            <button class="action-btn" onclick="copyAll()">📋 نسخ</button>
            <button class="action-btn" onclick="sharePage()">📤 مشاركة</button>
            <button class="action-btn" onclick="downloadImage()">🖼️ صورة</button>
            <button class="action-btn" onclick="window.print()">🖨️ PDF</button>
        </div>
        <div class="footer-note">انشرها فالدال على الخير كفاعله</div>
    </div>
    <div class="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>

    <script>
        // ========== PWA: تسجيل Service Worker ==========
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker مسجل', reg.scope))
                    .catch(err => console.log('فشل التسجيل', err));
            });
        }

        // ========== جسيمات ==========
        (function createParticles(){
            const c=document.getElementById('particlesContainer');
            for(let i=0;i<35;i++){
                const p=document.createElement('div');p.className='particle';
                const s=Math.random()*3.5+2;
                p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*18+12}s;animation-delay:${Math.random()*15}s`;
                c.appendChild(p);
            }
        })();

        // بيانات مختصرة (يمكن توسيعها بنفس النسق السابق)
        const morningData = [
            { number: "آية الكرسي", text: "﴿اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...﴾", source: "البقرة 255 - رواه الحاكم وابن حبان" },
            { number: "المعوذات (3 مرات)", text: "﴿قُلْ هُوَ اللَّهُ أَحَدٌ...﴾", source: "رواه أبو داود وحسنه الألباني" },
            { number: "١", text: "اللَّهُمَّ بِكَ أَصْبَحْنَا...", source: "رواه أبو داود والترمذي" },
            { number: "٢ سيد الاستغفار", text: "اللَّهُمَّ أَنْتَ رَبِّي...", source: "رواه البخاري" },
            { number: "٣", text: "اللَّهُمَّ فَاطِرَ السَّمَاوَاتِ...", source: "رواه الترمذي وأبو داود" },
            { number: "٤ (3 مرات)", text: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ...", source: "رواه الترمذي وابن ماجه" },
            { number: "٥ (3 مرات)", text: "رَضِيتُ بِاللَّهِ رَبًّا...", source: "رواه أحمد وأبو داود" },
            { number: "٦", text: "أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ...", source: "رواه أحمد" },
            { number: "٧ (3 مرات)", text: "اللَّهُمَّ عَافِنِي فِي بَدَنِي...", source: "رواه أبو داود" },
            { number: "٨", text: "يَا حَيُّ يَا قَيُّومُ...", source: "رواه البزار والنسائي" },
            { number: "٩", text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ...", source: "رواه مسلم" },
            { number: "١٠", text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ...", source: "رواه أبو داود وابن ماجه" },
            { number: "١١ (100 مرة)", text: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ...", source: "متفق عليه" },
            { number: "١٢ (100 مرة)", text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.", source: "رواه مسلم" }
        ];
        const eveningData = JSON.parse(JSON.stringify(morningData));
        eveningData[2].text = "اللَّهُمَّ بِكَ أَمْسَيْنَا...";
        eveningData[7].text = "أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ...";
        eveningData[9].text = "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ...";

        let currentTime='morning';
        function renderDhikr(time){
            const data=time==='morning'?morningData:eveningData;
            document.getElementById('dhikrList').innerHTML=data.map((item,i)=>`
                <div class="dhikr-card" style="animation-delay:${i*0.04}s">
                    <div class="misbaha-line">${Array(10).fill('<span class="bead"></span>').join('')}</div>
                    <span class="dhikr-number">${item.number}</span>
                    <div class="dhikr-text">${item.text}</div>
                    <div class="source-box">${item.source}</div>
                </div>`).join('');
        }
        function switchTime(time){
            currentTime=time;
            document.body.className=time==='morning'?'morning':'';
            document.getElementById('morningBtn').classList.toggle('active',time==='morning');
            document.getElementById('eveningBtn').classList.toggle('active',time==='evening');
            document.getElementById('iconMorning').style.opacity=time==='morning'?'1':'0';
            document.getElementById('iconEvening').style.opacity=time==='evening'?'1':'0';
            renderDhikr(time);
            window.scrollTo({top:0,behavior:'smooth'});
        }
        function copyAll(){
            const data=currentTime==='morning'?morningData:eveningData;
            const text=data.map(item=>item.text+'\n'+item.source).join('\n\n');
            navigator.clipboard.writeText(text).then(()=>alert('تم نسخ الأذكار'));
        }
        function sharePage(){
            if(navigator.share){
                navigator.share({
                    title:'كنوز اليوم والليلة',
                    text:'كتيب أذكار الصباح والمساء من القرآن والسنة النبوية الصحيحة',
                    url:window.location.href
                }).catch(()=>{});
            }else{
                navigator.clipboard.writeText(window.location.href).then(()=>alert('تم نسخ الرابط للمشاركة'));
            }
        }
        function downloadImage(){
            htmlToImage.toPng(document.getElementById('mainBook'),{quality:1.0,pixelRatio:2})
                .then(dataUrl=>{
                    const a=document.createElement('a');
                    a.download='كنوز-اليوم-والليلة.png';
                    a.href=dataUrl;a.click();
                }).catch(()=>alert('تعذر إنشاء الصورة'));
        }
        renderDhikr('morning');
    </script>
</body>
</html>
